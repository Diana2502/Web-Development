<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання 2</title>
  <style>
    body {
      font-family: Verdana, sans-serif;
      font-size: 20px;
      color: #222;
    }

    .seasons {
      list-style-image: url("arrow-right_16.png");
      padding-left: 40px;
    }

    .seasons > li {
      padding-left: 12px;
      margin-bottom: 4px;
    }

    .seasons ul {
      padding-left: 40px;
      margin: 4px 0;
    }

    .seasons ul li {
      padding-left: 4px;
    }

    .winter ul { list-style-image: url("snowflake_16.png"); }
    .spring ul { list-style-image: url("leaf_g_16.png"); }
    .summer ul { list-style-image: url("sun_16.png"); }
    .autumn ul { list-style-image: url("leaf_y_16.png"); }
  </style>
</head>
<body>
  <ul class="seasons">
    <li class="winter">Winter
      <ul>
        <li>December</li>
        <li>January</li>
        <li>February</li>
      </ul>
    </li>
    <li class="spring">Spring
      <ul>
        <li>March</li>
        <li>April</li>
        <li>May</li>
      </ul>
    </li>
    <li class="summer">Summer
      <ul>
        <li>June</li>
        <li>July</li>
        <li>August</li>
      </ul>
    </li>
    <li class="autumn">Autumn
      <ul>
        <li>September</li>
        <li>October</li>
        <li>November</li>
      </ul>
    </li>
  </ul>
</body>
</html>
