<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Властивість float. Варіант 14</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .wrapper {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    header, nav, main, aside, footer {
      background: #9db5d3;
      border: 2px solid #4a73a8;
      padding: 15px;
      text-align: center;
    }

    header, nav {
      margin-bottom: 10px;
    }

    main {
      float: left;
      width: calc(50% - 5px);
      margin-right: 10px;               
      margin-bottom: 10px;              
      height: 120px;
    }

    aside {
      float: left;
      width: calc(50% - 5px);
      margin-bottom: 10px;              
      height: 120px;
    }

    footer {
      clear: both;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>Заголовок</header>
    <nav>Меню</nav>
    <main>Вміст</main>
    <aside>Додаткова секція</aside>
    <footer>Нижній колонтитул</footer>
  </div>
</body>
</html>
