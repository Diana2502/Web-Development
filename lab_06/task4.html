<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 4</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bar {
      position: relative;
      width: 380px;
      height: 28px;
      box-sizing: border-box;
      border: 2px solid #74b6fc;
      border-radius: 14px;
      overflow: hidden;                 
    }

    .block {
      position: absolute;
      top: 0;
      left: 0;
      width: 30%;
      height: 100%;
      background: #74b6fc;
      animation: move 3s linear infinite;
    }

    @keyframes move {
      from { left: -30%; }              
      to   { left: 100%; }              
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="block"></div>
  </div>
</body>
</html>
