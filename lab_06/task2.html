<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 2</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f4;
    }
    .doors {
      position: relative;
      width: 420px;
      height: 140px;
      perspective: 600px;              
    }
    .text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font: bold 20px Arial, sans-serif;
      z-index: 1;
    }
    .door {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      box-sizing: border-box;
      background: #862d5c;
      border: 3px solid #6b1a4b;
      z-index: 2;
    }

    .left {
      left: 0;
      transform-origin: left center;   
    }

    .right {
      right: 0;
      transform-origin: right center;  
    }

    .doors:hover .door {
      transition: transform 2s;
    }

    .doors:hover .left {
      transform: rotateY(70deg);
    }

    .doors:hover .right {
      transform: rotateY(-70deg);
    }
  </style>
</head>
<body>
  <div class="doors">
    <div class="text">HELLO</div>
    <div class="door left"></div>
    <div class="door right"></div>
  </div>
</body>
</html>
